# Public Phone Intelligence provider examples
# Copy to ~/sec_lab/phone-intel/providers.conf and enable only lawful public sources.
# Command receives normalized phone as $1 and must print key=value lines.
# Allowed scopes: metadata, business, public-web
# Keep outputs limited to public/business metadata. Never use private-account
# enumeration, OTP/reset flows, leaked credentials, address discovery, or bypasses.
#
# Example local fixture provider:
# fixture|python3 /path/to/your/public_fixture.py "$1"|public-web
