name: Autonomous Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to OpenAI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run OpenAI client
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi
          python3 openai_client.py "$PROMPT"
